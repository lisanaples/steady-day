      <ellipse cx="48" cy="-28" rx="28" ry="52" fill="#fff7ed" transform="rotate(60 48 -28)"/>
      <ellipse cx="48" cy="28" rx="28" ry="52" fill="#fff7ed" transform="rotate(120 48 28)"/>
