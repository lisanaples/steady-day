    <text x="130" y="336" text-anchor="middle" font-family="Inter, Avenir, Arial, sans-serif" font-size="31" font-weight="800" fill="#172554">Smile</text>
    <text x="130" y="374" text-anchor="middle" font-family="Inter, Avenir, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">encouraging, friendly</text>
  </g>

  <g transform="translate(860 110)">
