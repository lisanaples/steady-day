    <path d="M67 206c35-35 91-35 126 0" fill="none" stroke="#fff7ed" stroke-width="21" stroke-linecap="round"/>
    <path d="M92 238h76" fill="none" stroke="#fff7ed" stroke-width="21" stroke-linecap="round"/>
    <text x="130" y="336" text-anchor="middle" font-family="Inter, Avenir, Arial, sans-serif" font-size="31" font-weight="800" fill="#172554">Sunrise</text>
    <text x="130" y="374" text-anchor="middle" font-family="Inter, Avenir, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">fresh start, steady routine</text>
