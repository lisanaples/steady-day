<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Steady Day icon comparison: sunrise, smile, flower">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.28" stop-color="#fdf2f8"/>
      <stop offset="0.58" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="sunrise" x1="88" x2="314" y1="92" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="0.32" stop-color="#fb923c"/>
      <stop offset="0.58" stop-color="#ec4899"/>
      <stop offset="0.8" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="smile" x1="486" x2="712" y1="92" y2="318" gradientUnits="userSpaceOnUse">
